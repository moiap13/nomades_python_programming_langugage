{% extends 'includes/_base.html' %}
{% from "includes/_macros.html" import displayField %}

{% block title %}
Login
{% endblock %}

{% block contents %}
<h1>Login</h1>
<form action="{{ url_for('login.login') }}" method="post">
  {{ displayField(form.uid, placeholder="Username or Email") }}
  {{ displayField(form.pwd, placeholder="Password") }}
  <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
