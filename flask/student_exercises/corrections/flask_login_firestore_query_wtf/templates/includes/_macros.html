{% macro displayField(formField, displayLabel=True) %}
<div class="mb-3">
  {% if displayLabel %}
  {{ formField.label(class="form-label") }}
  {% endif %}
  {{ formField(class="form-control", **kwargs) }}
  {% if formField.errors %}
  {% for error in formField.errors %}
  <div class="alert alert-danger mt-1" role="alert">
    {{ error }}
  </div>
  {% endfor %}
  {% endif %}
</div>
{% endmacro %}
