{% extends 'includes/_base.html' %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block contents %}
<h1>{{ page_title}} ({{ posts | length }})</h1>

<div class="row">
  <form action="" method="get" class="mb-3">
    <div class="row">
      <div class="col-3">
        <input type="date" class="form-control" name="date_start" value="">
      </div>
      <div class="col-3">
        <input type="date" class="form-control" name="date_end" value="">
      </div>
      <div class="col-3">
        <button type="submit" class="btn btn-primary">Filter</button>
      </div>
    </div>
  </form>
  {% if not posts %}
  <div class="col-lg-12">
    <div class="alert alert-info" role="alert">
      There are no posts. To create a post click <a href="{{ url_for('post.create_post') }}">here</a>.
    </div>
  </div>
  {% endif %}
  <div class="row">
    <div class="col-12">
      {{ post_per_date_bar | safe }}
    </div>
  </div>
</div>
{% endblock %}
