{% extends 'includes/_base.html' %}

{% block title %}
Login
{% endblock %}

{% block contents %}
<h1>Login</h1>
<form action="{{ url_for('login.login') }}" method="post">
  <div class="form-group">
    {{ form.uid.label() }}
    {{ form.uid(class="form-control") }}
  </div>
  <div class="form-group mt-3">
    {{ form.pwd.label() }}
    {{ form.pwd(class="form-control") }}
  </div>
  <button type="submit" class="btn btn-primary mt-3">Login</button>
</form>
{% endblock %}
