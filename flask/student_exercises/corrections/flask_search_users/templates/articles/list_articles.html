{% extends 'includes/_base.html' %}
{% from 'includes/_macros.html' import displayField %}

{% block title %} My article{% endblock %}

{% block contents %}
<h1>My article</h1>
<div class="row">

  {% for article in articles %}
  <div class="col-xl-3 mb-4">
    <div class="card" style="width: 18rem;">
      <img src="{{ article.authors[0].get_pp_path() }}" class="card-img-top" alt="user's profile picture">
      <div class="card-body">
        <h5 class="card-title">{{ article.title }}</h5>
        <p class="card-text">{{ article.body }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
