{% extends 'includes/_base.html' %}

{% block title %}
Login
{% endblock %}

{% block contents %}
<form action="{{ url_for('login') }}" method="post"> <!-- set the attributes (action and method) -->
  <div class="mb-3">
    <label for="tbx_email" class="form-label">Email address</label>
    <input type="email" class="form-control" id="tbx_email" placeholder="name@example.com" name="tbx_email" required>
  </div>
  <div class="mb-3">
    <label for="tbx_password" class="form-label">Password</label>
    <input type="password" class="form-control" id="tbx_password" placeholder="Password" name="tbx_password" required>
  </div>
  <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
