<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>If</title>
</head>

<body>
  <h1>If</h1>

  {% if age >= 18 %}
  <h2>You are allowed to vote</h2>
  {% elif age >= 16 %}
  <h2>You will soon be allowed to vote</h2>
  {% else %}
  <h2>You are not allowed to vote</h2>
  {% endif %}
</body>

</html>
