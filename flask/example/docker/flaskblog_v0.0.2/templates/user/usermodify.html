{% extends 'includes/_base.html' %}

{% block title %}
User Info
{% endblock %}

{% block contents %}
<h1>User Modification</h1>
<form action="{{ url_for('user.user_modify') }}" method="POST">
  <!-- Add action using url_for (the action should be to modify the user route) -->
  <div class="row">
    <div class="col-12">
      <div class="row">
        <div class="col-6 text-end">
          <h5>firstname</h5>
        </div>
        <div class="col-6">
          <input type="text" name="firstname" value="{{ user['firstname'] }}">
        </div>
      </div>
      <div class="row">
        <div class="col-6 text-end">
          <h5>Lastname</h5>
        </div>
        <div class="col-6">
          <input type="text" name="lastname" value="{{ user['lastname'] }}">
        </div>
      </div>
      <div class="row">
        <div class="col-6 text-end">
          <h5>Username</h5>
        </div>
        <div class="col-6">
          <input type="text" name="uid" value="{{ user['uid'] }}">
        </div>
      </div>
      <div class="row">
        <div class="col-6 text-end">
          <h5>
            Email
          </h5>
        </div>
        <div class="col-6">
          <input type="text" name="email" value="{{ user['email'] }}">
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-12 text-center">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </div>
</form>
{% endblock %}
