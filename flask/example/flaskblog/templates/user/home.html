{% extends 'includes/_base.html' %}

{% block title %}
Home

{% block contents %}
<div class="row">

    <div class="row">
      <div class="col-6 text-end">
        <h5>Firstname :</h5>
      </div>
      <div class="col-6">
        <p>{{ firstname }}</p>
      </div>
    </div>
    <div class="row">

        <h5>Lastname :</h5>
      </div>
      <div class="col-6">
        <p>{{ lastname }}</p>
      </div>
    </div>
    <div class="row">
      <div class="col-6 text-end">
        <h5>Email :</h5>
      </div>
      <div class="col-6">
        <p>{{ email }}</p>
      </div>
    </div>
  </div>
